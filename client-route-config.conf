# Список доменов и подсетей, трафик которых заворачивается в туннель.
# client-setup.sh резолвит каждый SITES в A-записи (/32) и кладёт SUBNETS как есть.
# Диапазоны Google/YouTube и AWS CloudFront подгружаются динамически в client-setup.sh.

SITES=(
    # Торрент-трекеры
    rutracker.org
    pornolab.net
    kinozal.tv

    # Zencoder (плагин + бэкенд). Хостится на CloudFront — основное покрытие
    # даёт динамический список CloudFront, домены оставлены для подстраховки.
    zencoder.ai
    fe.zencoder.ai

    # JetBrains: Marketplace, сайт, загрузки плагинов/IDE (тоже CloudFront)
    plugins.jetbrains.com
    jetbrains.com
    download.jetbrains.com

    # Активация JetBrains (jetbra.in)
    jetbra.in
    3.jetbra.in

    # Albion Online: рынок, игровые/статусные сервисы, форум
    cdn.albionfreemarket.com
    api.albionfreemarket.com
    albionfreemarket.com
    europe.albion-online-data.com
    albiononline.com
    live.albiononline.com
    status.albiononline.com
    serverstatus.albiononline.com
    serverstatus-ams.albiononline.com
    serverstatus-sgp.albiononline.com
    forum.albiononline.com

    # YouTube (домены; основные диапазоны идут из goog.txt в client-setup.sh)
    googlevideo.com
    youtube.com
    www.youtube.com
    m.youtube.com
    youtubei.googleapis.com
    youtube.googleapis.com
    yt3.ggpht.com
    i.ytimg.com
    s.ytimg.com

    # Deezer живёт на Akamai/Fastly/GCP/CloudFront с постоянной ротацией IP,
    # поэтому перечислить его /32 нельзя. Для Deezer используй полный туннель:
    #   sudo FULL_TUNNEL=1 ./client-up.sh
    # Домены ниже оставлены как best-effort для split-режима (apex на CloudFront).
    deezer.com
    www.deezer.com
    account.deezer.com
)

SUBNETS=(
    # ПАО «Центральный телеграф» (cnt.ru), Москва — ручная подсеть
    213.85.208.0/21
)
